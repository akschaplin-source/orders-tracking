name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Скачать код
      uses: actions/checkout@v4

    - name: Установить Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Установить Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Настроить Android SDK
      run: |
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
        echo "/usr/local/lib/android/sdk/tools" >> $GITHUB_PATH
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Создать папку www и скопировать файлы
      run: |
        mkdir -p www
        cp *.html www/
        cp *.css www/ 2>/dev/null || true
        cp *.js www/ 2>/dev/null || true
        cp -r images www/ 2>/dev/null || true

    - name: Установить Capacitor
      run: npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Добавить Android и синхронизировать
      run: |
        npx cap add android
        npx cap sync android

    - name: Собрать APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace
      env:
        GRADLE_OPTS: "-Xmx2048m"

    - name: Сохранить APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicPlayer-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
