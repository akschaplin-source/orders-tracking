<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор заказов</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }

        .calculator {
            background: #000;
            border-radius: 24px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(255, 165, 0, 0.3);
            border: 2px solid #ff8c00;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 20px;
            color: #ffa500;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ff8c00;
            background: transparent;
            color: #ff8c00;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%);
            color: #000;
            border-color: #ffa500;
        }

        .display {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            min-height: 100px;
            border: 1px solid #333;
        }

        .measurements {
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .measurement-item {
            background: #2d2d2d;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 3px solid #ff8c00;
        }

        .measurement-item .value {
            color: #ffa500;
            font-weight: 600;
        }

        .total {
            font-size: 28px;
            font-weight: 700;
            color: #ffa500;
            text-align: right;
            padding: 8px 0;
            border-top: 2px solid #333;
        }

        .total-label {
            font-size: 12px;
            color: #888;
            text-align: right;
            margin-bottom: 4px;
        }

        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff8c00;
            background: #2d2d2d;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .btn {
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-add {
            background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%);
            color: #000;
        }

        .btn-clear {
            background: #2d2d2d;
            color: #ff8c00;
            border: 2px solid #ff8c00;
        }

        .btn-equals {
            background: linear-gradient(135deg, #ffa500 0%, #ffcc00 100%);
            color: #000;
            grid-column: span 3;
        }

        .save-section {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
            display: none;
            border: 1px solid #333;
        }

        .save-section.active {
            display: block;
        }

        .save-section input,
        .save-section textarea {
            width: 100%;
            background: #2d2d2d;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 8px;
            font-family: inherit;
        }

        .save-section textarea {
            resize: vertical;
            min-height: 60px;
        }

        .save-section input:focus,
        .save-section textarea:focus {
            outline: none;
            border-color: #ff8c00;
        }

        .btn-save {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff8c00 0%, #ffa500 100%);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
        }

        .orders-feed {
            max-height: 300px;
            overflow-y: auto;
        }

        .order-card {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #ff8c00;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .order-number {
            font-size: 14px;
            font-weight: 700;
            color: #ffa500;
        }

        .order-date {
            font-size: 11px;
            color: #888;
        }

        .order-value {
            font-size: 18px;
            font-weight: 700;
            color: #ffcc00;
            margin-bottom: 6px;
        }

        .order-comment {
            font-size: 13px;
            color: #ccc;
            line-height: 1.4;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 13px;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #ff8c00;
            border-radius: 3px;
        }

        @media (max-width: 400px) {
            .calculator {
                padding: 16px;
            }

            .header h1 {
                font-size: 18px;
            }

            .total {
                font-size: 24px;
            }

            .btn {
                padding: 14px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="header">
            <h1>⚡ КАЛЬКУЛЯТОР</h1>
        </div>

        <div class="mode-switch">
            <button class="mode-btn active" data-mode="square">м²</button>
            <button class="mode-btn" data-mode="linear">п.м.</button>
        </div>

        <div class="display">
            <div class="measurements" id="measurements"></div>
            <div class="total-label">ИТОГО:</div>
            <div class="total" id="total">0 м²</div>
        </div>

        <div class="input-row" id="inputRow">
            <div class="input-group">
                <label>Длина (м)</label>
                <input type="number" id="length" step="0.01" placeholder="0.00">
            </div>
            <div class="input-group" id="widthGroup">
                <label>Ширина (м)</label>
                <input type="number" id="width" step="0.01" placeholder="0.00">
            </div>
        </div>

        <div class="buttons">
            <button class="btn btn-add" id="addBtn">+</button>
            <button class="btn btn-clear" id="clearBtn">C</button>
            <button class="btn btn-equals" id="equalsBtn">=</button>
        </div>

        <div class="save-section" id="saveSection">
            <input type="text" id="orderNumber" placeholder="Номер заказа">
            <textarea id="orderComment" placeholder="Комментарий..."></textarea>
            <button class="btn-save" id="saveBtn">Сохранить заказ</button>
        </div>

        <div class="orders-feed" id="ordersFeed">
            <div class="empty-state">Заказы появятся здесь</div>
        </div>
    </div>

    <script>
        let mode = 'square';
        let measurements = [];
        let orders = JSON.parse(localStorage.getItem('orders') || '[]');

        const modeBtns = document.querySelectorAll('.mode-btn');
        const widthGroup = document.getElementById('widthGroup');
        const lengthInput = document.getElementById('length');
        const widthInput = document.getElementById('width');
        const addBtn = document.getElementById('addBtn');
        const clearBtn = document.getElementById('clearBtn');
        const equalsBtn = document.getElementById('equalsBtn');
        const totalDisplay = document.getElementById('total');
        const measurementsDisplay = document.getElementById('measurements');
        const saveSection = document.getElementById('saveSection');
        const saveBtn = document.getElementById('saveBtn');
        const ordersFeed = document.getElementById('ordersFeed');

        // Переключение режима
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                mode = btn.dataset.mode;
                widthGroup.style.display = mode === 'square' ? 'flex' : 'none';
                reset();
            });
        });

        // Добавить измерение
        addBtn.addEventListener('click', () => {
            const length = parseFloat(lengthInput.value);
            if (isNaN(length) || length <= 0) {
                alert('Введите длину');
                return;
            }

            let value;
            if (mode === 'square') {
                const width = parseFloat(widthInput.value);
                if (isNaN(width) || width <= 0) {
                    alert('Введите ширину');
                    return;
                }
                value = length * width;
                measurements.push({ length, width, value });
            } else {
                value = length;
                measurements.push({ length, value });
            }

            updateDisplay();
            lengthInput.value = '';
            widthInput.value = '';
            lengthInput.focus();
        });

        // Очистить
        clearBtn.addEventListener('click', reset);

        // Равно
        equalsBtn.addEventListener('click', () => {
            if (measurements.length === 0) {
                alert('Добавьте хотя бы одно измерение');
                return;
            }
            saveSection.classList.add('active');
            document.getElementById('orderNumber').focus();
        });

        // Сохранить заказ
        saveBtn.addEventListener('click', () => {
            const orderNumber = document.getElementById('orderNumber').value.trim();
            const comment = document.getElementById('orderComment').value.trim();

            if (!orderNumber) {
                alert('Введите номер заказа');
                return;
            }

            const total = measurements.reduce((sum, m) => sum + m.value, 0);
            const order = {
                id: Date.now(),
                number: orderNumber,
                comment: comment,
                value: total.toFixed(2),
                unit: mode === 'square' ? 'м²' : 'п.м.',
                date: new Date().toLocaleString('ru-RU')
            };

            orders.unshift(order);
            localStorage.setItem('orders', JSON.stringify(orders));

            document.getElementById('orderNumber').value = '';
            document.getElementById('orderComment').value = '';
            saveSection.classList.remove('active');

            renderOrders();
            reset();
        });

        function updateDisplay() {
            const total = measurements.reduce((sum, m) => sum + m.value, 0);
            const unit = mode === 'square' ? 'м²' : 'п.м.';
            totalDisplay.textContent = `${total.toFixed(2)} ${unit}`;

            measurementsDisplay.innerHTML = measurements.map((m, i) => {
                if (mode === 'square') {
                    return `<div class="measurement-item">
                        <span>${m.length} × ${m.width} м</span>
                        <span class="value">${m.value.toFixed(2)} м²</span>
                    </div>`;
                } else {
                    return `<div class="measurement-item">
                        <span>${m.length} м</span>
                        <span class="value">${m.value.toFixed(2)} п.м.</span>
                    </div>`;
                }
            }).join('');
        }

        function reset() {
            measurements = [];
            lengthInput.value = '';
            widthInput.value = '';
            totalDisplay.textContent = mode === 'square' ? '0 м²' : '0 п.м.';
            measurementsDisplay.innerHTML = '';
            saveSection.classList.remove('active');
        }

        function renderOrders() {
            if (orders.length === 0) {
                ordersFeed.innerHTML = '<div class="empty-state">Заказы появятся здесь</div>';
                return;
            }

            ordersFeed.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-number">#${order.number}</span>
                        <span class="order-date">${order.date}</span>
                    </div>
                    <div class="order-value">${order.value} ${order.unit}</div>
                    ${order.comment ? `<div class="order-comment">${order.comment}</div>` : ''}
                </div>
            `).join('');
        }

        // Инициализация
        renderOrders();
    </script>
</body>
</html>
